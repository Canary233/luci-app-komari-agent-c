name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: komari-agent-c
  FEED_NAME: komari_ci

jobs:
  build-openwrt:
    name: Build ${{ matrix.arch }} on ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
        version:
          - 24.10.6
          - 25.12.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Prepare package
        run: |
          mkdir -p package
          cp -r komari-agent-c package/

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: komari-agent-c

      - name: Verify package formats
        run: |
          echo "Checking for IPK packages (legacy OpenWrt < 24.10)..."
          IPK_COUNT=$(find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.ipk" 2>/dev/null | wc -l)
          echo "Found $IPK_COUNT IPK package(s)"

          echo "Checking for APK packages (OpenWrt >= 24.10)..."
          APK_COUNT=$(find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.apk" 2>/dev/null | wc -l)
          echo "Found $APK_COUNT APK package(s)"

          if [ "$IPK_COUNT" -eq 0 ] && [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: Build failed - no package files found!"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.version }}
          path: bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/*.*pk
          retention-days: 1

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.arch }}-${{ matrix.version }}
          path: logs/
          retention-days: 1

  build-luci:
    name: Build LuCI app
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 24.10.6
          - 25.12.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Prepare packages
        run: |
          mkdir -p package
          cp -r luci-app-komari-agent-c package/
          cp -r komari-agent-c package/

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-${{ matrix.version }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: luci-app-komari-agent-c

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: luci-app-komari-agent-c-${{ matrix.version }}
          path: |
            bin/packages/*/${{ env.FEED_NAME }}/luci-app-komari-agent-c*.*pk
            bin/packages/*/${{ env.FEED_NAME }}/luci-i18n-komari-agent-c*.*pk
          retention-days: 1

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-luci-${{ matrix.version }}
          path: logs/
          retention-days: 1

  release:
    needs: [build-openwrt, build-luci]
    if: always() && (needs.build-openwrt.result == 'success' || needs.build-openwrt.result == 'skipped') && (needs.build-luci.result == 'success' || needs.build-luci.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        # Full history (including tags) is required so GitHub's release notes
        # generator can resolve the previous release tag and produce a scoped
        # changelog instead of falling back to HEAD.
        with:
          fetch-depth: 0

      - name: Download OpenWrt packages
        if: needs.build-openwrt.result == 'success'
        uses: actions/download-artifact@v6
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: true

      - name: Download LuCI packages
        if: needs.build-luci.result == 'success'
        uses: actions/download-artifact@v6
        with:
          pattern: luci-app-*
          path: dist/
          merge-multiple: true

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Komari Agent v${{ steps.get_version.outputs.VERSION }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
