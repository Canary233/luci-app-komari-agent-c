name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'komari-agent-c/**'
      - 'luci-app-komari-agent-c/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'komari-agent-c/**'
      - 'luci-app-komari-agent-c/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: komari-agent-c
  FEED_NAME: komari_ci

jobs:
  test-openwrt-build:
    name: Test build on ${{ matrix.arch }} (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
        version:
          - 24.10.6
          - 25.12.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Prepare package
        run: |
          mkdir -p package
          cp -r komari-agent-c package/

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: komari-agent-c
          KOMARI_VERBOSE_CMAKE: ON

      - name: Verify build
        run: |
          echo "Checking for IPK packages..."
          IPK_COUNT=$(find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.ipk" 2>/dev/null | wc -l)
          echo "Found $IPK_COUNT IPK package(s)"

          echo "Checking for APK packages..."
          APK_COUNT=$(find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.apk" 2>/dev/null | wc -l)
          echo "Found $APK_COUNT APK package(s)"

          if [ "$IPK_COUNT" -eq 0 ] && [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: Build failed - no package files found!"
            exit 1
          fi

          echo "Build successful for ${{ matrix.arch }} on ${{ matrix.version }}"
          echo ""
          echo "IPK packages:"
          find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.ipk" -exec ls -lh {} \; 2>/dev/null || echo "  (none)"
          echo ""
          echo "APK packages:"
          find bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/ -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "  (none)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-${{ matrix.arch }}-${{ matrix.version }}
          path: bin/packages/${{ matrix.arch }}/${{ env.FEED_NAME }}/*.*pk
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-test-${{ matrix.arch }}-${{ matrix.version }}
          path: logs/
          retention-days: 7

  test-luci-build:
    name: Test LuCI build on (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - 24.10.6
          - 25.12.2

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Prepare packages
        run: |
          mkdir -p package
          cp -r luci-app-komari-agent-c package/
          cp -r komari-agent-c package/

      - name: Build
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-${{ matrix.version }}
          FEEDNAME: ${{ env.FEED_NAME }}
          PACKAGES: luci-app-komari-agent-c
          KOMARI_VERBOSE_CMAKE: ON

      - name: Verify build
        run: |
          echo "Checking for LuCI packages..."
          IPK_COUNT=$(find bin/packages/ -name "luci-app-komari-agent-c*.ipk" 2>/dev/null | wc -l)
          echo "Found $IPK_COUNT IPK package(s)"

          APK_COUNT=$(find bin/packages/ -name "luci-app-komari-agent-c*.apk" 2>/dev/null | wc -l)
          echo "Found $APK_COUNT APK package(s)"

          I18N_COUNT=$(find bin/packages/ -name "luci-i18n-komari-agent-c*.*pk" 2>/dev/null | wc -l)
          echo "Found $I18N_COUNT i18n package(s)"

          if [ "$IPK_COUNT" -eq 0 ] && [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: Build failed - no LuCI package files found!"
            exit 1
          fi

          echo "Build successful for OpenWrt ${{ matrix.version }}"

      - name: Collect i18n packages
        run: |
          mkdir -p i18n-artifacts
          find bin/packages/ -name "luci-i18n-komari-agent-c*.*pk" -exec cp {} i18n-artifacts/ \;
          echo "Collected i18n packages:"
          ls -lh i18n-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: test-luci-${{ matrix.version }}
          path: i18n-artifacts/*
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-luci-test-${{ matrix.version }}
          path: logs/
          retention-days: 7

  lint:
    name: Code quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install codespell

      - name: Spell check
        run: |
          codespell --skip=".git,*.po,*.ipk,*.apk,*.lmo" --ignore-words-list="ba,dne,nce,nam,ot,tht"

      - name: Check shell scripts
        run: |
          set -e
          find . -name "*.sh" -exec bash -n {} \;

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev

      - name: Build and run unit tests
        working-directory: komari-agent-c
        run: |
          cmake -B build -DKOMARI_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure


